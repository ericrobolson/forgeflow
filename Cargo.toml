[package]
name = "forgeflow"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chumsky = "0.13.0"
crossterm = "0.29.0"
ctrlc = { version = "3.4", features = ["termination"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4", "v7"] }
walkdir = "2.5.0"
