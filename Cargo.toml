[package]
name = "forgeflow"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
base64 = "0.23.1"
chumsky = "0.13.0"
crossterm = "0.29.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v7"] }
walkdir = "2.5.0"
